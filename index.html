<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urdu letter-trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Fraunces:ital,wght@0,600;1,500;1,600&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--paper:#F6F0E2;--card:#FFFCF3;--ink:#2A1D14;--mute:#8A7256;--line:#E2D3A8;
--indigo:#0E5C46;--indigo-ink:#F6EAC9;--gold:#C79A2E;--sage:#2F8F6D;--maroon:#A6335A;
--shadow:rgba(42,29,20,.16);--ok:#2F8F6D;--bad:#A6335A;--acc:#C79A2E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--paper:#131A18;--card:#1B2422;--ink:#F0E6CE;--mute:#9DAAA2;--line:#2E3B37;
--indigo:#5FBE9B;--indigo-ink:#0E1614;--gold:#E3B54F;--sage:#5FBE9B;--maroon:#E387A0;
--shadow:rgba(0,0,0,.45);--ok:#5FBE9B;--bad:#E387A0;--acc:#E3B54F}}
:root[data-theme="dark"]{
--paper:#131A18;--card:#1B2422;--ink:#F0E6CE;--mute:#9DAAA2;--line:#2E3B37;
--indigo:#5FBE9B;--indigo-ink:#0E1614;--gold:#E3B54F;--sage:#5FBE9B;--maroon:#E387A0;
--shadow:rgba(0,0,0,.45);--ok:#5FBE9B;--bad:#E387A0;--acc:#E3B54F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);background-image:
 linear-gradient(45deg,rgba(199,154,46,.07) 1px,transparent 1px),
 linear-gradient(-45deg,rgba(14,92,70,.06) 1px,transparent 1px);
 background-size:26px 26px;
 color:var(--ink);font:15px/1.55 'Work Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding:14px 16px 32px}
header.top{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
h1{font:italic 600 26px/1.1 'Fraunces',Georgia,serif;margin:0;color:var(--ink);letter-spacing:.2px}
h1 .mark{font-style:normal;color:var(--gold);margin-right:2px}
.sub{color:var(--mute);margin:4px 0 14px;font-size:13.5px}
nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;
 -webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line)}
nav::-webkit-scrollbar{height:4px}
nav button{flex:0 0 auto;padding:8px 13px;border:1px solid var(--line);background:transparent;color:var(--mute);
 border-radius:999px;font:500 13px 'Work Sans',sans-serif;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
nav button[aria-selected=true]{background:var(--indigo);color:var(--indigo-ink);border-color:var(--indigo);font-weight:600;box-shadow:0 0 0 2px var(--gold) inset}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 20px 22px;text-align:center;
 box-shadow:0 6px 20px -8px var(--shadow);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;
 background:linear-gradient(90deg,var(--indigo),var(--gold),var(--maroon))}
.big{font:700 84px/1.3 'Noto Naskh Arabic',serif;direction:rtl;margin:6px auto 4px;display:inline-block;
 padding:30px 36px 22px;position:relative;background:var(--paper);
 border:2px solid var(--gold);border-radius:50% 50% 10px 10px/64px 64px 10px 10px;
 box-shadow:inset 0 0 0 5px var(--card),inset 0 0 0 7px var(--gold)}
.big::before{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%);
 width:9px;height:9px;border-radius:50%;background:var(--gold)}
.info{min-height:60px;margin:14px 0 12px}
.info b{font-size:19px;font-family:'Fraunces',serif;font-style:italic}
.row{display:flex;gap:8px}
.row button,.opt,.wide{flex:1;padding:13px;border-radius:11px;border:1px solid var(--line);background:var(--paper);
 color:var(--ink);font:500 15px 'Work Sans',sans-serif;cursor:pointer;transition:border-color .15s,background .15s}
.row button:active,.opt:active,.wide:active{transform:translateY(1px)}
.pri{background:var(--indigo)!important;color:var(--gold)!important;border-color:var(--indigo)!important;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{font-size:18px}
.opt.ar{font:700 36px/1.4 'Noto Naskh Arabic',serif}
.opt.good{background:var(--sage)!important;color:#fff!important;border-color:var(--sage)!important}
.opt.wrong{background:var(--maroon)!important;color:#fff!important;border-color:var(--maroon)!important}
.msg{min-height:22px;margin:14px 0 0;font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 4px;text-align:center}
.cell .ar{font:700 30px/1.3 'Noto Naskh Arabic',serif}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--indigo))}
.small{font-size:13px;color:var(--mute)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pn{font:italic 600 34px 'Fraunces',serif;margin:6px 0;color:var(--ink)}
.cw{position:relative;margin:10px 0}
canvas{width:100%;border:1px dashed var(--line);border-radius:11px;touch-action:none;background:var(--paper)}
.gh{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:700 110px 'Noto Naskh Arabic',serif;color:var(--indigo);opacity:.35;pointer-events:none}
.sp{border:0;background:none;font-size:19px;cursor:pointer}
.ans{min-height:56px;border:1px solid var(--line);border-radius:11px;padding:10px;font:700 28px "Noto Naskh Arabic",serif;
 display:flex;flex-wrap:wrap;gap:12px;margin:10px 0;background:var(--paper)}
summary{cursor:pointer;font-weight:600;color:var(--indigo)}
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.theme-btn{padding:13px 14px;border:1px solid var(--line);border-left:4px solid var(--gold);background:var(--card);
 border-radius:10px;cursor:pointer;font:500 15px 'Work Sans',sans-serif;color:var(--ink);text-align:left;transition:background .15s}
.theme-btn:active{background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left}
th{background:var(--paper);font-weight:600;color:var(--ink)}
</style>
</head>
<body>
<main>
<header class="top"><h1><span class="mark">اردو</span> letter-trainer</h1></header>
<p class="sub">Van letter tot lopende tekst — jouw pad door het Urdu-schrift</p>
<nav role="tablist">
<button role="tab" data-t="pad" aria-selected="true">Pad</button>
<button role="tab" data-t="learn" aria-selected="false">Leren</button>
<button role="tab" data-t="quiz" aria-selected="false">Quiz</button>
<button role="tab" data-t="write" aria-selected="false">Schrijven</button>
<button role="tab" data-t="forms" aria-selected="false">Vormen</button>
<button role="tab" data-t="vowels" aria-selected="false">Klinkers</button>
<button role="tab" data-t="words" aria-selected="false">Woorden</button>
<button role="tab" data-t="sent" aria-selected="false">Zinnen</button>
<button role="tab" data-t="themes" aria-selected="false">Thema's</button>
<button role="tab" data-t="gram" aria-selected="false">Grammatica</button>
<button role="tab" data-t="dial" aria-selected="false">Dialogen</button>
<button role="tab" data-t="read" aria-selected="false">Lezen</button>
<button role="tab" data-t="prog" aria-selected="false">Voortgang</button>
</nav>
<div id="view"></div>
</main>
<script>
const R=`ا|alif|a / lange aa|klinkerdrager, rechte streep|1
ب|be|b|1 punt onder|1
پ|pe|p|3 punten onder|1
ت|te|t|2 punten boven|1
ٹ|Te|t (tong naar achteren)|als ت met klein ط-teken erboven|1
ث|se|s|3 punten boven|1
ج|jiim|dj|1 punt onder|2
چ|che|tsj|3 punten onder|2
ح|baRi he|h (diep)|geen punt|2
خ|khe|ch (schrapend)|1 punt boven|2
د|daal|d|geen punt|3
ڈ|Daal|d (tong naar achteren)|als د met klein ط-teken|3
ذ|zaal|z|als د met 1 punt boven|3
ر|re|r (rollend)|geen punt|4
ڑ|Re|r (tong geklapt)|als ر met klein ط-teken|4
ز|ze|z|als ر met 1 punt boven|4
ژ|zhe|zj (zoals in genie)|als ر met 3 punten boven|4
س|siin|s|geen punt|5
ش|shiin|sj|als س met 3 punten boven|5
ص|suaad|s|geen punt|5
ض|zuaad|z|als ص met 1 punt boven|5
ط|toe|t|geen punt|6
ظ|zoe|z|als ط met 1 punt boven|6
ع|'ain|keelklank (keel vernauwen)|geen punt|6
غ|ghain|gh (keel-r)|als ع met 1 punt boven|6
ف|fe|f|1 punt boven|7
ق|qaaf|q (diepe k uit de keel)|2 punten boven|7
ک|kaaf|k|geen punt|7
گ|gaaf|g|als ک met extra streepje|7
ل|laam|l|geen punt|8
م|miim|m|geen punt|8
ن|nuun|n|1 punt boven|8
و|vaao|v / oe / o|geen punt|8
ہ|choTi he|h|geen punt|9
ھ|do-chashmi he|maakt de klank ervoor geaspireerd (bh, kh)|verbindt altijd met een letter ervoor|9
ء|hamza|korte klankstop|klein teken|9
ی|choTi ye|j / ie|2 punten onder (aan het eind)|9
ے|baRi ye|e / ej|lange staart, alleen aan het eind|9`;
const L=R.split('\n').map(r=>{const[c,n,s,t,g]=r.split('|');return{c,n,s,t,g:+g}});
const KEY='urdu-m1-v2',fmt=d=>d.toLocaleDateString('sv');
let S={},M={};
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j){S=j.s||{};M=j.m||{}}else{const o=JSON.parse(localStorage.getItem('urdu-m1-scores')||'{}');for(const c in o)S[c]={b:o[c]>=4?2:o[c]>=1?1:0,d:Date.now()}}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({s:S,m:M}))}catch(e){}};
const IV=[0,6e5,864e5,2592e5,6048e5,13824e5];
function grade(c,ok){const b=S[c]?S[c].b:0,nb=ok?Math.min(5,b+1):0;S[c]={b:nb,d:Date.now()+IV[nb]};
 const t=fmt(new Date());if(M.day!==t){M.streak=M.day===fmt(new Date(Date.now()-864e5))?(M.streak||0)+1:1;M.day=t;M.n=0}M.n=(M.n||0)+1;save()}
function next(skip,seenOnly){const now=Date.now(),seen=L.filter(l=>S[l.c]&&l.c!==skip);
 const due=seen.filter(l=>S[l.c].d<=now).sort((a,b)=>S[a.c].d-S[b.c].d).slice(0,4);
 if(due.length)return due[Math.floor(Math.random()*due.length)];
 if(!seenOnly){const u=L.find(l=>!S[l.c]);if(u)return u}
 return seen.sort((a,b)=>S[a.c].b-S[b.c].b)[0]||null}
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const $=id=>document.getElementById(id),V=$('view');let last=null;
const hasUr=()=>'speechSynthesis' in window&&speechSynthesis.getVoices().some(v=>/^ur/i.test(v.lang));
const say=c=>{const u=new SpeechSynthesisUtterance(c);u.lang='ur-PK';speechSynthesis.speak(u)};
const inf=l=>`<b>${l.n}</b> · klank: <b>${l.s}</b><br><span class="small">${l.t}</span>${hasUr()?` <button class="sp" onclick="say('${l.c}')">🔊</button>`:''}`;
const empty='<div class="card">Begin eerst bij Leren: daar maak je kennis met de letters.</div>';

function learn(){const l=next(last);last=l.c;const nw=!S[l.c];
 V.innerHTML=`<div class="card">${nw?'<p class="small">Nieuwe letter</p>':''}<p class="big">${l.c}</p><div class="info" id="info">${nw?inf(l):'<span class="small">Noem eerst naam en klank in gedachten.</span>'}</div><div id="act"></div></div>`;
 const a=$('act');
 if(nw){a.innerHTML='<button class="wide pri" id="ok" style="width:100%">Onthouden</button>';$('ok').onclick=()=>{S[l.c]={b:0,d:Date.now()};save();learn()}}
 else{a.innerHTML='<button class="wide pri" id="rv" style="width:100%">Toon antwoord</button>';$('rv').onclick=()=>{$('info').innerHTML=inf(l);a.innerHTML='<div class="row"><button id="no">Nog niet</button><button class="pri" id="yes">Wist ik</button></div>';$('no').onclick=()=>{grade(l.c,false);learn()};$('yes').onclick=()=>{grade(l.c,true);learn()}}}}

function quiz(){const l=next(last,true);if(!l){V.innerHTML=empty;return}last=l.c;const toName=Math.random()<.5;
 const o=shuffle([l,...L.filter(x=>x.c!==l.c).map(x=>[(x.g===l.g?0:1)+Math.random(),x]).sort((a,b)=>a[0]-b[0]).slice(0,3).map(x=>x[1])]);
 V.innerHTML=`<div class="card">${toName?`<p class="big">${l.c}</p><p class="small">Wat is de naam van deze letter?</p>`:`<p class="pn">${l.n}</p><p class="small">klank: ${l.s}. Welke letter is dit?</p>`}<div class="opts">${o.map(x=>toName?`<button class="opt" data-c="${x.c}">${x.n}</button>`:`<button class="opt ar" data-c="${x.c}">${x.c}</button>`).join('')}</div><p class="msg" id="msg"></p><button class="wide pri" id="nx" style="display:none;width:100%;margin-top:8px">Volgende</button></div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.c===l.c;grade(l.c,ok);
  document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.c===l.c)x.classList.add('good')});if(!ok)b.classList.add('wrong');
  $('msg').textContent=(ok?'Goed! ':'Nee. ')+`${l.c} = ${l.n}, klank ${l.s}`;$('msg').style.color=ok?'var(--ok)':'var(--bad)';$('nx').style.display='block';$('nx').onclick=quiz})}

function pad(sub,title,ans,fs,done){V.innerHTML=`<div class="card"><p class="pn">${title}</p><p class="small">${sub}</p><div class="cw"><canvas id="cv" width="320" height="200"></canvas><div class="gh" id="gh" style="font-size:${fs}px">${ans}</div></div><div id="act" class="row"><button id="cl">Wissen</button><button class="pri" id="sh">Toon antwoord</button></div></div>`;
 const cv=$('cv'),x=cv.getContext('2d');x.lineWidth=7;x.lineCap='round';x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#000';
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};let d=false;
 cv.onpointerdown=e=>{d=true;cv.setPointerCapture(e.pointerId);const[p,q]=pt(e);x.beginPath();x.moveTo(p,q)};
 cv.onpointermove=e=>{if(!d)return;const[p,q]=pt(e);x.lineTo(p,q);x.stroke()};cv.onpointerup=()=>d=false;
 $('cl').onclick=()=>x.clearRect(0,0,320,200);
 $('sh').onclick=()=>{$('gh').style.display='flex';$('act').innerHTML='<button id="no">Niet goed</button><button class="pri" id="yes">Goed genoeg</button>';$('no').onclick=()=>done(false);$('yes').onclick=()=>done(true)}}
function write(){const l=next(last,true);if(!l){V.innerHTML=empty;return}last=l.c;pad('klank: '+l.s+'. Schrijf de letter uit je hoofd.',l.n,l.c,120,ok=>{grade(l.c,ok);write()})}

function nx2(items,k,skip){const now=Date.now(),seen=items.filter(i=>S[k(i)]&&k(i)!==skip);
 const due=seen.filter(i=>S[k(i)].d<=now).sort((a,b)=>S[k(a)].d-S[k(b)].d).slice(0,4);
 if(due.length)return due[Math.floor(Math.random()*due.length)];
 const u=items.find(i=>!S[k(i)]&&k(i)!==skip);if(u)return u;
 return seen.sort((a,b)=>S[k(a)].b-S[k(b)].b)[0]||items[0]}
const J='\u200D',NC='ادڈذرڑزژوےء';
const fm=l=>{const n=NC.includes(l.c);return{Los:l.c,Begin:n?null:l.c+J,Midden:n?null:J+l.c+J,Eind:J+l.c}};
const fhtml=l=>`<div class="fg">${Object.entries(fm(l)).map(([k,v])=>`<div class="cell"><div class="ar">${v||'–'}</div><div class="small">${k}</div></div>`).join('')}</div>`+(NC.includes(l.c)?'<p class="small">Deze letter verbindt niet met de letter erna. Daarna begint een nieuwe vorm.</p>':'');
let lf=null,lw=null;
function forms(){const pool=L.filter(l=>S[l.c]);if(!pool.length){V.innerHTML=empty;return}
 const l=nx2(pool,i=>'f'+i.c,lf);lf='f'+l.c;
 if(!S[lf]){V.innerHTML=`<div class="card"><p class="small">Vormen van ${l.n} (begin, midden, eind)</p>${fhtml(l)}<button class="wide pri" id="ok" style="width:100%;margin-top:12px">Onthouden</button></div>`;$('ok').onclick=()=>{S[lf]={b:0,d:Date.now()};save();forms()};return}
 const c=Object.values(fm(l)).filter(v=>v&&v!==l.c),v=c[Math.floor(Math.random()*c.length)];
 const o=shuffle([l,...shuffle(L.filter(x=>x.c!==l.c)).slice(0,3)]);
 V.innerHTML=`<div class="card"><p class="big">${v}</p><p class="small">Dit is een verbonden vorm. Welke letter?</p><div class="opts">${o.map(x=>`<button class="opt" data-c="${x.c}">${x.n}</button>`).join('')}</div><div id="rv"></div><button class="wide pri" id="nx" style="display:none;width:100%;margin-top:8px">Volgende</button></div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.c===l.c;grade(lf,ok);
  document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.c===l.c)x.classList.add('good')});if(!ok)b.classList.add('wrong');
  $('rv').innerHTML=fhtml(l);$('nx').style.display='block';$('nx').onclick=forms})}

const W=`کتاب|kitaab|boek
پانی|paani|water
نام|naam|naam
کام|kaam|werk
دن|din|dag
رات|raat|nacht
بات|baat|gesprek, zaak
سب|sab|alles, iedereen
اب|ab|nu
تم|tum|jij
ہم|hum|wij
دل|dil|hart
گھر|ghar|huis
ہاتھ|haath|hand
بہت|bahut|veel
دوست|dost|vriend
پیار|pyaar|liefde
شام|shaam|avond
صبح|subah|ochtend
کل|kal|gisteren of morgen
میں|main, mein|ik (of: in)
آپ|aap|u

ہے|hai|is

سلام|salaam|hallo, vrede

کرنا|karnaa|doen

خدا حافظ|khudaa haafiz|tot ziens

لکھنا|likhnaa|schrijven
پڑھنا|paRhnaa|lezen
سمجھنا|samajhnaa|begrijpen

چلنا|chalnaa|lopen
کھیلنا|khelnaa|spelen
دینا|denaa|geven

خوش|khush|blij
بھوک|bhuuk|honger
پیاس|pyaas|dorst
بیمار|biimaar|ziek

let gm=null,gx=0;
function gramList(){V.innerHTML=`<div class="card"><p class="small">${GRAMMAR.length} modules — kies er een</p><div class="row" style="flex-wrap:wrap;gap:8px">${GRAMMAR.map((g,i)=>`<button class="theme-btn" data-i="${i}" style="flex:1 1 100%;text-align:left">${i+1}. ${g.title}</button>`).join('')}</div><p class="small" style="margin-top:10px">Alle 10 grammaticamodules zijn nu beschikbaar.</p></div>`;
 document.querySelectorAll('.theme-btn').forEach(b=>b.onclick=()=>{gm=+b.dataset.i;gx=0;gramShow()})}
function gramShow(){const g=GRAMMAR[gm];
 V.innerHTML=`<div class="card" style="text-align:left"><p class="pn" style="font-size:22px;text-align:center">${g.title}</p><p>${g.explanation}</p>
 <div style="overflow-x:auto"><table>${g.table.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${c}</th>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>
 <p class="small" style="margin-top:10px"><b>Voorbeelden</b></p>
 ${g.examples.map(e=>`<p style="margin:4px 0"><span style="font:600 22px 'Noto Naskh Arabic',serif" dir="rtl">${e[0]}</span><br><span class="small">${e[1]} — ${e[2]}</span></p>`).join('')}
 <p class="small" style="margin-top:8px"><b>Tip:</b> ${g.tip}</p>
 <button class="wide pri" id="go" style="width:100%;margin-top:12px">Oefenen (${g.exercises.length} vragen)</button>
 <button class="wide" id="bk" style="width:100%;margin-top:6px">← Terug naar overzicht</button></div>`;
 $('go').onclick=()=>{gx=0;gramEx()};$('bk').onclick=gramList}
function gramEx(){const g=GRAMMAR[gm];if(gx>=g.exercises.length){V.innerHTML=`<div class="card"><p>Klaar! Je hebt alle vragen van "${g.title}" gehad.</p><button class="wide pri" id="bk" style="width:100%">← Terug naar overzicht</button></div>`;$('bk').onclick=gramList;return}
 const e=g.exercises[gx],k='g'+gm+'-'+gx;
 V.innerHTML=`<div class="card"><p class="small">${g.title} · vraag ${gx+1}/${g.exercises.length}</p><p style="font:600 20px 'Noto Naskh Arabic',serif;direction:rtl" dir="rtl">${e.q}</p><div class="opts">${e.opts.map((o,i)=>`<button class="opt" data-i="${i}" style="font-size:18px">${o}</button>`).join('')}</div><p class="msg" id="msg"></p><button class="wide pri" id="nx" style="display:none;width:100%;margin-top:8px">Volgende</button></div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===e.ans;grade(k,ok);
  document.querySelectorAll('.opt').forEach((z,i)=>{z.disabled=true;if(i===e.ans)z.classList.add('good')});if(!ok)b.classList.add('wrong');
  $('msg').textContent=e.uitleg;$('msg').style.color=ok?'var(--ok)':'var(--bad)';$('nx').style.display='block';$('nx').onclick=()=>{gx++;gramEx()}})}

function pct(items,key,mastered){const n=items.length;if(!n)return 0;
 const done=items.filter(i=>{const k=key(i);return mastered?(S[k]&&S[k].b>=4):!!S[k]}).length;
 return Math.round(done/n*100)}
function gramTotal(){let n=0;GRAMMAR.forEach(g=>n+=g.exercises.length);return n}

}
